        <div class="flex items-center space-x-3 mb-8">
          <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-luxury-600 to-gold-500 flex items-center justify-center font-serif text-white font-bold text-lg shadow-lg shadow-luxury-500/20">LM</div>
          <div>
            <h1 class="text-sm font-bold tracking-wider uppercase text-gold-400 font-serif">Leo Mejillano</h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-sans">Supplier Portal</p>

        </div>

        <nav class="space-y-1.5">
          <a href="dashboard.html" data-nav-page="dashboard.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z"></path></svg>
            <span>Dashboard</span>
          </a>
          <a href="purchase-orders.html" data-nav-page="purchase-orders.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            <span>Purchase Orders</span>
          </a>
          <a href="order-history.html" data-nav-page="order-history.html" class="bg-luxury-900/60 text-white font-medium border-l-4 border-gold-400 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span>Order History</span>
          </a>
          <a href="profile.html" data-nav-page="profile.html" class="text-slate-400 hover:bg-slate-800/50 hover:text-slate-200 w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150">
            <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>

          </a>
        </nav>
      </div>

      <div>
        <div class="p-4 border-t border-slate-800">
          <a href="../../backend/auth/logout.php" class="w-full text-left flex items-center space-x-3 px-3.5 py-2.5 rounded-lg text-xs transition duration-150 text-rose-400 hover:bg-rose-900/50 hover:text-rose-300">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4"></path></svg>
            <span>Sign Out</span>
          </a>
        </div>
        <div class="p-4 bg-slate-950 border-t border-slate-800/80 text-[10px] text-slate-400 space-y-1">
          <p class="font-bold text-slate-300">STI College Legazpi</p>
          <p>Capstone Project Proposal &copy; 2026</p>
        </div>
      </div>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-slate-950 overflow-y-auto">

      <header class="bg-slate-900 border-b border-luxury-900 px-6 py-4 shrink-0">
        <h2 class="text-lg font-serif font-bold text-white">Order History</h2>
        <p class="text-[11px] text-slate-400">Every purchase order ever placed against your account.</p>
      </header>

      <div class="p-6 space-y-6">

        <div class="bg-slate-900 border border-luxury-900 rounded-xl p-4 flex flex-wrap items-center gap-2">
          <span class="text-xs text-slate-400 font-semibold">Filter:</span>
          <template x-for="opt in ['All', 'Order Confirmed', 'Out for Delivery', 'Received', 'Completed']" :key="opt">
            <button @click="filterStatus = opt"
                    :class="filterStatus === opt ? 'bg-luxury-700 text-white' : 'bg-slate-950 text-slate-400 hover:text-slate-200'"
                    class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-800 transition duration-150" x-text="opt"></button>
          </template>
        </div>

        <div class="bg-slate-900 border border-luxury-900 rounded-2xl p-5">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs text-slate-300">
              <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                <tr>
                  <th class="p-3">Order Reference</th>
                  <th class="p-3">Branch</th>
                  <th class="p-3">Order Date</th>
                  <th class="p-3">Delivery Date</th>
                  <th class="p-3 text-center">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-800/80">
                <template x-for="order in getFilteredOrders()" :key="order.id">
                  <tr class="hover:bg-slate-800/30 transition">
                    <td class="p-3 font-bold text-gold-400" x-text="order.reference"></td>
                    <td class="p-3 font-medium text-purple-300" x-text="order.branch || '—'"></td>
                    <td class="p-3 text-slate-400" x-text="order.orderDate"></td>
                    <td class="p-3 text-slate-400" x-text="order.expectedDate || '—'"></td>
                    <td class="p-3 text-center">
                      <span :class="$store.supplier.getStatusBadgeClass(order.status)" class="px-2 py-0.5 rounded text-[10px] font-bold" x-text="$store.supplier.getStatusLabel(order.status)"></span>
                    </td>
                  </tr>
                </template>
                <template x-if="getFilteredOrders().length === 0">
                  <tr><td colspan="5" class="p-6 text-center text-slate-500 italic">No orders match this filter.</td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../../scripts/supplier/shared-data.js"></script>
  <script src="../../scripts/supplier/order-history.js"></script>
</body>
</html>
